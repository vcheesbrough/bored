version: 1
metadata:
  name: bored development OIDC
  labels:
    blueprints.goauthentik.io/description: "bored development OAuth2 provider, scope, and application binding"

entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: bored-dev-users
    attrs:
      name: bored-dev-users

  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "bored:dev:access"
    attrs:
      name: "bored:dev:access"
      scope_name: "bored:dev:access"
      description: "Grants access to bored dev environment"
      expression: |
        return {}

  # The scope bored's telemetry ingest (otlp-collector-oidc) requires — card
  # #416, decision D1. It adds no claim: being granted it is the permission.
  # On bored's own browser provider, so the session's access token carries it
  # and the SPA can present that token to the ingest. Identified by name, not
  # scope_name, because another product's instance of the collector's
  # reference blueprint may define its own `telemetry:write` mapping.
  # Kept identical to the entry in blueprint.yaml.
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "bored: telemetry:write"
    attrs:
      name: "bored: telemetry:write"
      scope_name: "telemetry:write"
      description: "Send client telemetry to bored's ingest"
      expression: |
        return {}

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: bored-browser-dev
    attrs:
      name: bored-browser-dev
      client_id: bored-browser-dev
      client_secret: ${AUTHENTIK_BORED_DEV_CLIENT_SECRET}
      client_type: confidential
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      redirect_uris:
        - url: "https://bored-dev.desync.link/auth/callback"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "bored:dev:access"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "bored: telemetry:write"]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: bored-dev
    attrs:
      name: bored (dev)
      slug: bored-dev
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, bored-browser-dev]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, bored-dev]]
      group: !Find [authentik_core.group, [name, bored-dev-users]]
      order: 0
    attrs:
      target: !Find [authentik_core.application, [slug, bored-dev]]
      group: !Find [authentik_core.group, [name, bored-dev-users]]
      order: 0
      enabled: true
      negate: false
      timeout: 30

  # ── Read-only SQL console at https://bored-dev.desync.link/dbconsole (card #473) ──────────
  # A forward-auth proxy provider in front of pgweb, gated to its own group.
  # Deliberately NO `authentik_outposts.outpost` entry: the embedded outpost is
  # shared by every LAN service Authentik protects, and a blueprint sets its
  # provider list wholesale — an entry here would detach all of them.
  # scripts/attach-sqltool-outpost.sh appends this provider instead.
  - model: authentik_core.group
    state: present
    identifiers:
      name: bored-dev-sql-console
    attrs:
      name: bored-dev-sql-console

  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: bored-sql-console-dev
    attrs:
      name: bored-sql-console-dev
      # The host, not /dbconsole: Authentik builds its callback from the
      # hostname alone (the compose file's callback router depends on it).
      external_host: "https://bored-dev.desync.link"
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: bored-sql-console-dev
    attrs:
      name: bored SQL console (dev)
      slug: bored-sql-console-dev
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, bored-sql-console-dev]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, bored-sql-console-dev]]
      group: !Find [authentik_core.group, [name, bored-dev-sql-console]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
      target: !Find [authentik_core.application, [slug, bored-sql-console-dev]]
      group: !Find [authentik_core.group, [name, bored-dev-sql-console]]
