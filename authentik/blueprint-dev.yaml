version: 1
metadata:
  name: bored development OIDC
  labels:
    blueprints.goauthentik.io/description: "bored development OAuth2 provider, scope, and application binding"

entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: bored-dev-users
    attrs:
      name: bored-dev-users

  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "bored:dev:access"
    attrs:
      name: "bored:dev:access"
      scope_name: "bored:dev:access"
      description: "Grants access to bored dev environment"
      expression: |
        return {}

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: bored-browser-dev
    attrs:
      name: bored-browser-dev
      client_id: bored-browser-dev
      client_secret: ${AUTHENTIK_BORED_DEV_CLIENT_SECRET}
      client_type: confidential
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      redirect_uris:
        - url: "https://bored-dev.desync.link/auth/callback"
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "bored:dev:access"]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: bored-dev
    attrs:
      name: bored (dev)
      slug: bored-dev
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, bored-browser-dev]]

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, bored-dev]]
      group: !Find [authentik_core.group, [name, bored-dev-users]]
      order: 0
    attrs:
      target: !Find [authentik_core.application, [slug, bored-dev]]
      group: !Find [authentik_core.group, [name, bored-dev-users]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
