[package]
name = "backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "backend"
path = "src/main.rs"

# Inherited wholesale from `[workspace.lints]`. Cargo forbids a member that both
# inherits and adds entries here, so this crate's one exception —
# `clippy::result_large_err` — lives as a `#![allow]` in src/main.rs instead.
[lints]
workspace = true

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tokio.workspace = true
shared.workspace = true
tracing.workspace = true
# `json` on top of the workspace features: the backend emits structured logs.
tracing-subscriber = { workspace = true, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "catch-panic"] }
# BroadcastStream wraps a broadcast::Receiver as a futures Stream so we can
# feed it directly into axum's Sse response type.
tokio-stream = { version = "0.1", features = ["sync"] }
# Used in the sse_handler return-type bound (Stream<Item=…>).
futures-util = "0.3"
url = "2"
surrealdb = { version = "2", features = ["kv-mem", "kv-surrealkv"] }
ulid = "1"
# `EnumIter` / `EnumCount` on `error::ErrorType`, so tests (and #415's metric
# setup) can walk every variant without a hand-kept list that could drift.
# Already in the dependency tree via surrealdb; this adds no new crate.
strum = { version = "0.27", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
# OIDC auth — JWT validation against cached JWKS, code/token exchange,
# httpOnly cookie handling, cryptographic state nonce generation.
jsonwebtoken = "9"
reqwest.workspace = true
axum-extra = { version = "0.9", features = ["cookie", "cookie-private"] }
rand = "0.8"
base64.workspace = true
sha2 = "0.10"
# Layered configuration composition root (backend/src/config.rs) — see
# card #288. Tracks the sovereign-config server release (2.30.2). The provider
# negotiates a protocol version on connect, so a server upgrade does not
# require rebuilding bored; bump this tag to pick up client fixes.
sovereign-config-provider = { git = "https://github.com/vcheesbrough/sovereign-config", tag = "2.30.2", features = [
    "config",
] }
config = "0.15"
# `time` is used for cookie max_age durations — the `cookie` crate (via
# axum-extra) re-exports time::Duration but having it as an explicit dep
# makes call sites easier to read and guarantees a consistent version.
time = "0.3"

# ── Telemetry (card #415) ────────────────────────────────────────────────────
# One set, moved together. `tracing-opentelemetry` sets the pace: it lags the
# core crates and each release requires exactly one core version, so the core
# family below is whatever the newest `tracing-opentelemetry` asks for — read
# from its crates.io requirement, never inferred from the version numbers
# (they look paired and are not: 0.34 here needs core 0.33).
#
# Only `observability.rs` may import `opentelemetry_sdk`, `opentelemetry_otlp`,
# `tracing_opentelemetry` or `opentelemetry_appender_tracing` — a test scans
# `src/` for them. `opentelemetry` (the API crate, no SDK inside) and
# `opentelemetry-semantic-conventions` are the façade and may appear anywhere;
# `opentelemetry-http` belongs to the transport layer (`app.rs`, the outbound
# client).
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
# http/protobuf — the spec's default transport, and the one the collector's
# `:4318` listener speaks. No tonic/gRPC stack, and no HTTP client feature: the
# exporter's own client would bring reqwest 0.13 beside the workspace's 0.12,
# so `observability.rs` hands it an adapter over the workspace client instead
# (`OtlpHttpClient`, which needs `async-trait`, `bytes` and `http` below).
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "http-proto",
    "internal-logs",
] }
opentelemetry-http = "0.33"
opentelemetry-semantic-conventions = { version = "0.33", features = [
    "semconv_experimental",
] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
# `service.instance.id` is a version-5 UUID of the container hostname, so it is
# stable across restarts and does not publish the hostname itself.
uuid = { version = "1", features = ["v5"] }
async-trait = "0.1"
bytes = "1"
http = "1"

[dev-dependencies]
# In-memory span, log and metric exporters, so the telemetry tests assert on
# what an exporter actually received rather than on configuration.
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
# A throwaway self-signed certificate for the TLS listener's shutdown tests
# (`listen::serve_tls`), made at test time so no key is committed. `ring`,
# the crypto provider the backend already uses, rather than rcgen's default.
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }
axum-test = "15"
serial_test = "3"
# The storage engine under SurrealDB, opened directly by the `!ts` key-leak
# test (card #470) so it counts keys without going through SurrealDB — an
# oracle independent of the code under test. Pinned with `=` to the version
# surrealdb-core resolves to in Cargo.lock, so the test reads the same on-disk
# format the backend writes; bump it together with surrealdb.
surrealkv = "=0.9.3"
tempfile = "3"
