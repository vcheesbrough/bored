[package]
name = "backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "backend"
path = "src/main.rs"

# Inherited wholesale from `[workspace.lints]`. Cargo forbids a member that both
# inherits and adds entries here, so this crate's one exception —
# `clippy::result_large_err` — lives as a `#![allow]` in src/main.rs instead.
[lints]
workspace = true

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tokio.workspace = true
shared.workspace = true
tracing.workspace = true
# `json` on top of the workspace features: the backend emits structured logs.
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-loki = { version = "0.2", features = ["compat-0-2-1"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
# BroadcastStream wraps a broadcast::Receiver as a futures Stream so we can
# feed it directly into axum's Sse response type.
tokio-stream = { version = "0.1", features = ["sync"] }
# Used in the sse_handler return-type bound (Stream<Item=…>).
futures-util = "0.3"
url = "2"
surrealdb = { version = "2", features = ["kv-mem", "kv-surrealkv"] }
ulid = "1"
serde.workspace = true
serde_json.workspace = true
# OIDC auth — JWT validation against cached JWKS, code/token exchange,
# httpOnly cookie handling, cryptographic state nonce generation.
jsonwebtoken = "9"
reqwest.workspace = true
axum-extra = { version = "0.9", features = ["cookie", "cookie-private"] }
rand = "0.8"
base64.workspace = true
sha2 = "0.10"
# Layered configuration composition root (backend/src/config.rs) — see
# card #288. Tracks the sovereign-config server release (2.30.2). The provider
# negotiates a protocol version on connect, so a server upgrade does not
# require rebuilding bored; bump this tag to pick up client fixes.
sovereign-config-provider = { git = "https://github.com/vcheesbrough/sovereign-config", tag = "2.30.2", features = [
    "config",
] }
config = "0.15"
# `time` is used for cookie max_age durations — the `cookie` crate (via
# axum-extra) re-exports time::Duration but having it as an explicit dep
# makes call sites easier to read and guarantees a consistent version.
time = "0.3"

[dev-dependencies]
axum-test = "15"
serial_test = "3"
tempfile = "3"
