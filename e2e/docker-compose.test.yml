# Pin the Compose project name. Without it Compose derives the project from this
# file's parent directory — "e2e" — which v-note's repo also uses. Both repos
# share a Woodpecker agent and docker daemon, so the two test stacks landed in
# one namespace and each `up --force-recreate` tore down the other's containers
# (pipeline 191: "No such container", v-note services listed as orphans).
# Declared here rather than as `-p` at the call sites so CI's up/down, the local
# repro in AGENTS.md, and any ad-hoc run all agree. Card #346.
name: bored-e2e

services:
  # Mock OIDC provider — issues JWTs signed with its own JWKS so the bored
  # backend can validate them via the same flow as production. Test setup runs
  # the real authorization-code callback to obtain encrypted browser cookies;
  # client_credentials is retained only for the explicit bearer regression.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    environment:
      SERVER_PORT: 8080
      # JSON_CONFIG overrides the default token claims for the `default` issuer.
      # mock-oauth2-server's stock client_credentials token sets `aud` to the
      # requested scope and omits `scope` entirely — neither matches what our
      # backend expects (aud == client_id, scope contains REQUIRED_SCOPE), so
      # we customise the callback to issue tokens shaped like a real Authentik
      # response.
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 65,
              "requestMappings": [
                {
                  "requestParam": "client_id",
                  "match": "bored-test",
                  "claims": {
                    "sub": "bored-test-service-account",
                    "aud": ["bored-test"],
                    "scope": "openid profile email offline_access bored:test:access telemetry:write",
                    "preferred_username": "test-user",
                    "email": "test@example.com"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - e2e-net

  # The image under test. Reached through `app` (the Traefik edge below),
  # never directly: the browser, the OIDC redirect and the tests all use
  # https://app, as production users go through Traefik.
  bored:
    image: ${TEST_IMAGE:?TEST_IMAGE must be set}
    environment:
      # Client telemetry (card #416). Production serves the ingest on the
      # app's own origin (Traefik routes `/v1/` to it); here the SPA reaches
      # it cross-origin, with CORS allowed for https://app on the ingest —
      # same-origin routing is Traefik's contract, not bored's, so the edge
      # below routes only the app.
      BORED__CLIENT_TELEMETRY__ENDPOINT: https://collector:4318
      # The server's own export (card #415), to the same fake receiver, so the
      # telemetry spec can see a browser span and the server span it caused
      # in one trace. Literals here are safe: it is the host's docker CLI, not
      # a compose file, that must never carry OTEL_* (see
      # scripts/compose-up-with-otel.sh). The environment matches
      # BORED__OBSERVABILITY__ENVIRONMENT below, as the backend requires.
      OTEL_SERVICE_NAME: bored
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=test,telemetry_source=otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://receiver:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # No SOVEREIGN_CONFIG_ACCESS_URL[_FILE] here — the sovereign layer stays
      # off (config.rs falls back to defaults + env), proving the no-sovereign
      # fallback path e2e is meant to exercise.
      BORED__SERVER__DATABASE_PATH: /tmp/bored-test.db
      BORED__OBSERVABILITY__ENVIRONMENT: test
      # Deliberately no APP_VERSION override. The frontend reloads itself when
      # /api/info reports a version its own bundle was not built from (see
      # frontend/src/connection.rs), and both halves of the image are built
      # from the same RELEASE_TAG — so an override here would be a permanent
      # mismatch and every page in the suite would reload on a loop.
      BORED__OBSERVABILITY__LOG_LEVEL: warn
      # OIDC configured against the mock. The /default issuer is built in
      # to mock-oauth2-server and accepts tokens for any client_id.
      BORED__OIDC__ISSUER_URL: http://mock-oidc:8080/default
      BORED__OIDC__CLIENT_ID: bored-test
      BORED__OIDC__CLIENT_SECRET: test-secret
      BORED__SESSION__COOKIE_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==
      BORED__OIDC__REDIRECT_URI: https://app/auth/callback
      BORED__OIDC__REQUIRED_SCOPE: bored:test:access
      BORED__OIDC__END_SESSION_URL: http://mock-oidc:8080/default/end-session
    depends_on:
      - mock-oidc
      - receiver
    networks:
      - e2e-net

  # The edge (card #449): a Traefik in front of the app, as production has, so
  # the browser talks HTTP/2 to a proxy that re-frames the SSE stream rather
  # than to bored directly. Without it the suite could not see a loss that
  # only a proxy exposes — which is how the SSE events dropped behind Traefik
  # went unnoticed until iteration 64 tried an edge. Named `app` so every
  # URL, cookie and redirect (https://app/…) is unchanged.
  app:
    build:
      context: ./edge
      dockerfile_inline: |
        FROM traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
        COPY dynamic.yml /etc/traefik/dynamic.yml
    command:
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      # The file is baked into the image and never changes, so no watcher:
      # on the shared CI host inotify instances run out, and Traefik then
      # starts with no routes at all (pipeline 325).
      - --providers.file.watch=false
      # bored presents a self-signed certificate; the homelab Traefik skips
      # verification of its backends the same way.
      - --serversTransport.insecureSkipVerify=true
      - --ping=true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      bored:
        condition: service_healthy
    networks:
      - e2e-net

  # The telemetry ingest, the released image unmodified (card #416), configured
  # as bored's deploy configures it: the browser session's issuer and client
  # id (decision D1), `bored-spa` only, identity narrowed to id and name
  # (decision D2), environment and path marker stamped.
  collector:
    image: ghcr.io/vcheesbrough/otlp-collector-oidc:0.13.0@sha256:2db8a527da487c9091b74ee3a537785153b26f914e9e6f3ca2f1684793f02666
    environment:
      OIDC_ISSUER_URL: http://mock-oidc:8080/default
      OIDC_AUDIENCE: bored-test
      # The mock starts after the ingest; retry discovery quickly rather than
      # answering `503 not ready` for the default 30 s.
      OIDC_DISCOVERY_RETRY: 2s
      ALLOWED_SERVICE_NAMES: bored-spa
      CLAIM_ATTRIBUTES: sub=user.id,preferred_username=user.name
      CLIENT_RESOURCE_ATTRIBUTES: deployment.environment.name=test,telemetry_source=client
      OTEL_EXPORTER_OTLP_ENDPOINT: http://receiver:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      LOG_OUTPUT: stdout
      # The page is https://app; the ingest is another origin here.
      CORS_ALLOWED_ORIGINS: https://app
    depends_on:
      - mock-oidc
      - receiver
    networks:
      - e2e-net

  # The fake OTLP receiver behind the ingest (and the server's own export):
  # writes what reaches it to the shared `otlp-out` volume. See
  # otlp/receiver.yaml.
  receiver:
    build:
      context: ./otlp
      dockerfile_inline: |
        FROM otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
        COPY receiver.yaml /etc/receiver.yaml
    command: ["--config=/etc/receiver.yaml"]
    # Root, to write into the freshly created (root-owned) named volume.
    user: "0"
    volumes:
      - otlp-out:/otlp
    networks:
      - e2e-net

  playwright:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
        WORKDIR /e2e
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        CMD ["npx", "playwright", "test"]
    environment:
      BASE_URL: https://app:443
      # Used by global-setup to fetch a token before the suite runs.
      OIDC_TOKEN_URL: http://mock-oidc:8080/default/token
      OIDC_CLIENT_ID: bored-test
      OIDC_CLIENT_SECRET: test-secret
      REQUIRED_SCOPE: bored:test:access
      # What the fake OTLP receiver wrote (card #416's telemetry spec).
      OTLP_OUT: /otlp/otlp.jsonl
    volumes:
      - ${REPORT_DIR:-./playwright-report}:/e2e/playwright-report
      - otlp-out:/otlp:ro
    depends_on:
      app:
        condition: service_healthy
      mock-oidc:
        condition: service_started
    networks:
      - e2e-net

networks:
  e2e-net:

volumes:
  # The fake receiver's output, shared read-only with the Playwright container.
  otlp-out:
