# Pin the Compose project name. Without it Compose derives the project from this
# file's parent directory — "e2e" — which v-note's repo also uses. Both repos
# share a Woodpecker agent and docker daemon, so the two test stacks landed in
# one namespace and each `up --force-recreate` tore down the other's containers
# (pipeline 191: "No such container", v-note services listed as orphans).
# Declared here rather than as `-p` at the call sites so CI's up/down, the local
# repro in AGENTS.md, and any ad-hoc run all agree. Card #346.
name: bored-e2e

services:
  # Mock OIDC provider — issues JWTs signed with its own JWKS so the bored
  # backend can validate them via the same flow as production. Test setup runs
  # the real authorization-code callback to obtain encrypted browser cookies;
  # client_credentials is retained only for the explicit bearer regression.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    environment:
      SERVER_PORT: 8080
      # JSON_CONFIG overrides the default token claims for the `default` issuer.
      # mock-oauth2-server's stock client_credentials token sets `aud` to the
      # requested scope and omits `scope` entirely — neither matches what our
      # backend expects (aud == client_id, scope contains REQUIRED_SCOPE), so
      # we customise the callback to issue tokens shaped like a real Authentik
      # response.
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 65,
              "requestMappings": [
                {
                  "requestParam": "client_id",
                  "match": "bored-test",
                  "claims": {
                    "sub": "bored-test-service-account",
                    "aud": ["bored-test"],
                    "scope": "openid profile email offline_access bored:test:access",
                    "preferred_username": "test-user",
                    "email": "test@example.com"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - e2e-net

  app:
    image: ${TEST_IMAGE:?TEST_IMAGE must be set}
    environment:
      # No SOVEREIGN_CONFIG_ACCESS_URL[_FILE] here — the sovereign layer stays
      # off (config.rs falls back to defaults + env), proving the no-sovereign
      # fallback path e2e is meant to exercise.
      BORED__SERVER__DATABASE_PATH: /tmp/bored-test.db
      BORED__OBSERVABILITY__ENVIRONMENT: test
      # Deliberately no APP_VERSION override. The frontend reloads itself when
      # /api/info reports a version its own bundle was not built from (see
      # frontend/src/connection.rs), and both halves of the image are built
      # from the same RELEASE_TAG — so an override here would be a permanent
      # mismatch and every page in the suite would reload on a loop.
      BORED__OBSERVABILITY__LOG_LEVEL: warn
      # OIDC configured against the mock. The /default issuer is built in
      # to mock-oauth2-server and accepts tokens for any client_id.
      BORED__OIDC__ISSUER_URL: http://mock-oidc:8080/default
      BORED__OIDC__CLIENT_ID: bored-test
      BORED__OIDC__CLIENT_SECRET: test-secret
      BORED__SESSION__COOKIE_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==
      BORED__OIDC__REDIRECT_URI: https://app/auth/callback
      BORED__OIDC__REQUIRED_SCOPE: bored:test:access
      BORED__OIDC__END_SESSION_URL: http://mock-oidc:8080/default/end-session
    depends_on:
      - mock-oidc
    networks:
      - e2e-net

  playwright:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
        WORKDIR /e2e
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        CMD ["npx", "playwright", "test"]
    environment:
      BASE_URL: https://app:443
      # Used by global-setup to fetch a token before the suite runs.
      OIDC_TOKEN_URL: http://mock-oidc:8080/default/token
      OIDC_CLIENT_ID: bored-test
      OIDC_CLIENT_SECRET: test-secret
      REQUIRED_SCOPE: bored:test:access
    volumes:
      - ${REPORT_DIR:-./playwright-report}:/e2e/playwright-report
    depends_on:
      app:
        condition: service_healthy
      mock-oidc:
        condition: service_started
    networks:
      - e2e-net

networks:
  e2e-net:
