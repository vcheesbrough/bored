[workspace]
members = ["shared", "backend", "frontend", "mcp"]
default-members = ["shared", "backend"]
resolver = "3"

[workspace.package]
version = "1.70.0"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Noncommercial-1.0.0"

# Dependencies shared by more than one workspace member. A member opts in with
# `dep.workspace = true`, which inherits the version *and* the features listed
# here; a member may add further features on top
# (`dep = { workspace = true, features = [...] }`) but cannot remove any, so
# what lives here is the intersection every member is happy with.
#
# Single-member dependencies deliberately stay in their own manifest — an entry
# used exactly once buys no deduplication and costs a second place to look.
[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# The `json` layer is backend-only (its stdout is collected into Loki), so it
# is added there rather than here — `mcp` logs plain text to stderr.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# One TLS stack across the workspace: rustls, no system OpenSSL. `backend`
# already required this; `mcp` inherits it rather than pulling reqwest's
# default native-tls backend for the same HTTPS calls to the same host.
#
# HTTP/1.1 only, deliberately (card #363, iteration 62). `default-features =
# false` leaves reqwest's `http2` feature off, and we keep it off. Measured
# 2026-09-28 before deciding:
#   * Both peers *do* offer h2 via ALPN — Authentik (the only peer of the
#     backend's shared client) and the bored proxy `mcp` talks to — so this is a choice,
#     not a limitation.
#   * No workload here benefits. Every client makes a few small sequential
#     requests to one origin over a kept-alive connection; h2 only wins on
#     many *concurrent* requests to one origin. Ten sequential GETs to the
#     bored proxy measured the same either way (first request ~55-62 ms with
#     the handshake, reused-connection requests ~0.5-1.3 ms, h1.1 and h2
#     indistinguishable).
#   * The cost falls on `mcp`: +3 crates, +0.96 MB (+10.6 %) on the release
#     binary (9.10 -> 10.06 MB) and a few seconds of clean build. `backend`
#     pays ~nothing (+528 bytes) — hyper/axum/tonic already compile `h2` in.
# Revisit if a member starts issuing concurrent requests to one origin (an
# HTTP exporter or fan-out client added under #415 would be the trigger).
#
# Revisited under #415, which added exactly that trigger — the OTLP exporter
# (backend/src/observability.rs, `OtlpHttpClient`) — and the answer is still
# HTTP/1.1. Each signal's SDK processor exports one batch at a time, so the
# collector sees at most three requests in flight (traces, logs, metrics),
# every few seconds, over plain `http://` inside the Docker network (no TLS,
# so no ALPN and no h2 without prior knowledge). Three kept-alive HTTP/1.1
# connections serve that as well as one multiplexed h2 connection would.
# Revisit if a batch processor is configured with concurrent exports
# (`with_max_concurrent_exports`) or export latency to the collector shows up.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
base64 = "0.22"

# Lints applied to every member via `[lints] workspace = true`. This is the set
# that was already in force — clippy's defaults, with CI adding `-D warnings` on
# the command line — so the table is wiring, not a new policy. Raising it (e.g.
# `clippy::pedantic`, `unsafe_code = "forbid"`) is a separate decision; the
# candidates are recorded on card #350.
#
# The negative priorities keep the groups below any specific lint added later:
# without them, Cargo refuses to order a group against an individual lint and
# the first specific override would have to rewrite this table.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
# `clippy::correctness` is deny-by-default and sits *inside* `all`, so the entry
# above would quietly downgrade it to a warning. Re-stating it at a higher
# priority restores the default; the two lines together are exactly clippy's own
# levels, which is what makes this table a no-op today.
correctness = { level = "deny", priority = -1 }
