# Step DAG: set depends_on on any step to enable parallel execution (Woodpecker stages).
# Push/manual: compute-version → build(local, no push) → e2e → (publish-image ∥ apply-authentik-blueprint-auto-dev) → auto-deploy-dev → tag-release-auto-dev
#   build only builds+validates locally; publish-image pushes to the registry ONLY after e2e passes, so the registry holds tested images only (PR #47).
# Deploy: validate-deployment → resolve-release-tag → apply-authentik-blueprint → verify-image → deploy-* → tag-release-*
#   Deployments do NOT allocate a version — resolve-release-tag reads the commit's already-built git tag; verify-image
#   pulls that exact artifact and does NOT rebuild (card #254).
#
# Release mechanics (see card #176):
#   - compute-version (plugin) allocates/reuses ONE semver per commit — on the PUSH pipeline only.
#   - Deployments (dev/prod) resolve that already-built tag from the commit's git tag; they never allocate (card #254).
#   - RELEASE_TAG is burned into the image (build-arg) and used as the single
#     docker tag; the git tag pushed after deploy is byte-identical.
#   - Git tagging happens after a successful dev OR prod deploy.

when:
  - event: [push, deployment, manual]

steps:
  compute-version:
    # Allocates/reuses ONE semver per commit — ONLY on the push pipeline, which
    # is the single place a version is minted. Deployments must NOT allocate:
    # they resolve the already-built tag via resolve-release-tag instead (a
    # deployment re-running compute allocated an unbuilt tag and broke prod
    # deploys — card #254).
    when:
      - event: [push, manual]
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.1@sha256:cf74d9706cb42b6d27c8d185789cd814ed061c8c88e06452d33ce3aed0bf9a22
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  build:
    # Build the image and validate its OCI labels LOCALLY — do not push yet.
    # The push is deferred to publish-image, which runs only after e2e passes, so
    # the registry never holds an image from a red e2e run and verify-image's
    # existence check on the deploy path becomes a real e2e gate (PR #47 review).
    # build/e2e/publish-image share one Woodpecker agent + docker daemon, so the
    # image built here is available to e2e and publish-image without a registry
    # round-trip. Base images are public, so no registry login is needed here.
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: &docker-image docker:27-cli@sha256:f56779b4e86550493153cc8642c9c8e40b5d934e43cb5b4ea463aea5245c5c01
    volumes: &docker-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # backend-builder's (and, defensively, frontend-builder's) cargo layers
      # need this to fetch the private sovereign-config-provider git
      # dependency (card #288).
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        CREATED=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
        IMAGE=registry.desync.link/bored:$$RELEASE_TAG
        docker build \
          --progress=plain \
          --secret id=github_token,env=GITHUB_TOKEN \
          --build-arg RELEASE_TAG="$$RELEASE_TAG" \
          --label org.opencontainers.image.version="$$RELEASE_TAG" \
          --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" \
          --label org.opencontainers.image.created="$$CREATED" \
          -t "$$IMAGE" .
        ./scripts/check-image-metadata.sh "$$IMAGE" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"

  e2e:
    when:
      - event: [push, manual]
    depends_on:
      - build
    image: *docker-image
    volumes: *docker-socket
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        REPORT=/srv/dev/playwright-reports/pipeline-$$CI_PIPELINE_NUMBER--$(echo $$CI_COMMIT_BRANCH | tr '/' '-')--$(echo $$CI_COMMIT_SHA | cut -c1-7)
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/bored:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml up --build --force-recreate --abort-on-container-exit --exit-code-from playwright && RC=0 || RC=$$?
        REPORT_DIR=$$REPORT TEST_IMAGE=registry.desync.link/bored:$$RELEASE_TAG docker compose -f e2e/docker-compose.test.yml down --volumes
        echo "Test report: $$REPORT/index.html"
        exit $$RC

  publish-image:
    # Push the built + validated image to the registry ONLY after e2e is green,
    # so the registry never contains an image from a red e2e run. This is what
    # makes verify-image's "can the tag be pulled" check on the deployment path a
    # genuine e2e-tested gate (card #254 / PR #47 review). Runs on the same agent
    # and docker daemon as build, so it pushes the exact image build produced.
    when:
      - event: [push, manual]
    depends_on:
      - e2e
    image: *docker-image
    volumes: *docker-socket
    environment: &registry-creds
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - &docker-login echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
      - docker push registry.desync.link/bored:$$(cat .release-tag)

  validate-deployment:
    when:
      - event: deployment
    depends_on: []
    image: alpine:3.21@sha256:f27cad9117495d32d067133afff942cb2dc745dfe9163e949f6bfe8a6a245339
    commands:
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" != "dev" ] && [ "$$CI_PIPELINE_DEPLOY_TARGET" != "prod" ]; then
          echo "ERROR: deploy target must be 'dev' or 'prod' (got: '$$CI_PIPELINE_DEPLOY_TARGET')"
          exit 1
        fi
      - |
        if [ "$$CI_PIPELINE_DEPLOY_TARGET" = "prod" ] && [ "$$CI_COMMIT_BRANCH" != "main" ]; then
          echo "ERROR: prod can only be deployed from main (current branch: '$$CI_COMMIT_BRANCH')"
          exit 1
        fi

  apply-authentik-blueprint:
    when:
      - event: deployment
    depends_on:
      - validate-deployment
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint.yaml
      instance_name: bored
      timeout_seconds: 900
      vars:
        AUTHENTIK_BORED_DEV_CLIENT_SECRET:
          from_secret: bored_dev_oidc_client_secret
        AUTHENTIK_BORED_PROD_CLIENT_SECRET:
          from_secret: bored_prod_oidc_client_secret
        AUTHENTIK_BORED_MCP_PROD_CLIENT_SECRET:
          from_secret: bored_mcp_prod_client_secret

  apply-authentik-blueprint-auto-dev:
    when:
      - event: [push, manual]
    depends_on:
      - e2e
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint-dev.yaml
      instance_name: bored
      timeout_seconds: 900
      vars:
        AUTHENTIK_BORED_DEV_CLIENT_SECRET:
          from_secret: bored_dev_oidc_client_secret

  resolve-release-tag:
    # A deployment promotes the EXACT version the main push pipeline already
    # built, e2e-tested, and dev-deployed for this commit — it must NEVER
    # allocate a new one. (compute-version does allocation and now runs on the
    # push pipeline only; re-allocating on a deployment produced an unbuilt tag
    # like :1.35.4 and broke prod deploys — card #254.) The version is the semver
    # git tag tag-release-auto-dev pushed onto this commit after its main
    # build+e2e+dev-deploy. Resolve it into .release-tag; fail closed if the
    # commit was never built/dev-deployed on main (no tag).
    when:
      - event: deployment
    depends_on:
      - validate-deployment
    image: *docker-image
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        apk add --no-cache git >/dev/null
        git config --global --add safe.directory '*'
        # Fast path: a semver tag on HEAD already present from the clone.
        RELEASE_TAG=$$(git tag --points-at HEAD 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$$' | sort -V | tail -1)
        # Fallback (private repo): query the remote without fetching objects.
        # For annotated tags the dereferenced (^{}) line carries the commit sha.
        if [ -z "$$RELEASE_TAG" ]; then
          RELEASE_TAG=$$(git ls-remote --tags "https://x-access-token:$$GITHUB_TOKEN@github.com/$$CI_REPO" \
            | awk -v sha="$$CI_COMMIT_SHA" '{ ref=$$2; sub("refs/tags/","",ref); sub(/\^\{\}$$/,"",ref) } $$1==sha && ref ~ /^[0-9]+\.[0-9]+\.[0-9]+$$/ { print ref }' \
            | sort -V | tail -1)
        fi
        if [ -z "$$RELEASE_TAG" ]; then
          echo "ERROR: commit $$CI_COMMIT_SHA has no release tag." >&2
          echo "A commit must finish the main push pipeline (build + e2e + dev deploy -> git tag) before it can be deployed." >&2
          exit 1
        fi
        printf '%s' "$$RELEASE_TAG" > .release-tag
        echo "Deploying release $$RELEASE_TAG (resolved from the main build/dev-deploy; no re-allocation)."

  verify-image:
    # A deployment promotes the artifact the push-event pipeline already built,
    # e2e-tested, and pushed for this commit — it does NOT rebuild (see card
    # #254). resolve-release-tag pins .release-tag to the commit's already-built
    # version, so the tag we pull here is byte-identical to what e2e validated
    # and what dev is running. Because publish-image only pushes AFTER e2e passes,
    # the tag existing in the registry *is* the e2e-passed signal — a red e2e run
    # never publishes it. Pull it and re-assert its OCI labels; fail loudly
    # (fail-closed) if it is absent, which means this commit never completed
    # build/e2e.
    when:
      - event: deployment
    depends_on:
      - resolve-release-tag
      - validate-deployment
    image: *docker-image
    volumes: *docker-socket
    environment: *registry-creds
    commands:
      - *docker-login
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/bored:$$RELEASE_TAG
        if ! docker pull "$$IMAGE"; then
          echo "ERROR: $$IMAGE not found in registry." >&2
          echo "The push-event pipeline (build + e2e) must succeed for this commit before it can be deployed." >&2
          echo "Push the commit and let its build + e2e pipeline finish (prod additionally requires it be on main), then re-run this deployment." >&2
          exit 1
        fi
        ./scripts/check-image-metadata.sh "$$IMAGE" "$$RELEASE_TAG" "$$CI_COMMIT_SHA"

  deploy-dev:
    # Everything a dev deploy needs except its trigger lives in &dev-deploy-base,
    # merged (`<<`) into both this step and auto-deploy-dev, so the two triggers
    # differ ONLY in when/depends_on and can never drift. (A single merged step
    # would need `optional: true` deps, which this Woodpecker rejects — card #254.)
    <<: &dev-deploy-base
      image: *docker-image
      volumes: *docker-socket
      environment:
        REGISTRY_USER:
          from_secret: zot_ci_user
        REGISTRY_PASSWORD:
          from_secret: zot_ci_password
        # OIDC/session config now lives in sovereign-config (card #288) — this
        # one read-only access URL replaces the individual OIDC_*/SESSION_COOKIE_KEY
        # secrets previously injected here. The Authentik blueprint steps still
        # use bored_{dev,prod}_oidc_client_secret directly (unchanged).
        SOVEREIGN_CONFIG_ACCESS_URL_FILE:
          from_secret: bored_dev_sovereign_access_url
      commands:
        - *docker-login
        - docker volume create bored-dev-db
        - |
          BORED_IMAGE_TAG=$(cat .release-tag) \
          APP_ENV=$$CI_COMMIT_BRANCH BORED_HOST=bored-dev.desync.link \
          BORED_CONTAINER_NAME=bored-dev DB_VOLUME=bored-dev-db \
          docker compose -p bored-dev -f deploy/docker-compose.yml up -d --pull always --wait --wait-timeout 120
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - verify-image
      - apply-authentik-blueprint

  deploy-prod:
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    depends_on:
      - verify-image
      - apply-authentik-blueprint
    image: *docker-image
    volumes: *docker-socket
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
      # OIDC/session config now lives in sovereign-config (card #288) — this one
      # read-only access URL replaces the individual OIDC_*/SESSION_COOKIE_KEY
      # secrets previously injected here. The Authentik blueprint step still
      # uses bored_prod_oidc_client_secret directly (unchanged).
      SOVEREIGN_CONFIG_ACCESS_URL_FILE:
        from_secret: bored_prod_sovereign_access_url
    commands:
      - *docker-login
      - docker volume create bored-prod-db
      - |
        BORED_IMAGE_TAG=$(cat .release-tag) \
        APP_ENV=production BORED_HOST=bored.desync.link \
        BORED_CONTAINER_NAME=bored DB_VOLUME=bored-prod-db \
        docker compose -p bored -f deploy/docker-compose.yml up -d --pull always --wait --wait-timeout 120

  auto-deploy-dev:
    # Same dev deploy as deploy-dev (via <<: *dev-deploy-base), fired on push.
    # Depends on publish-image because the deploy pulls the image from the
    # registry (`--pull always`), so it must be pushed (post-e2e) first.
    <<: *dev-deploy-base
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
      - apply-authentik-blueprint-auto-dev
      - publish-image

  tag-release-auto-dev:
    # All three tag-release steps share pull/image/settings via &tag-release-base
    # (push-tag mode is idempotent — a no-op if the commit is already tagged);
    # they differ only in when/depends_on.
    <<: &tag-release-base
      pull: true
      image: *version-plugin
      settings:
        mode: push-tag
        major_minor_source: cargo
        github_token:
          from_secret: github_token
    when:
      - event: [push, manual]
    depends_on:
      - auto-deploy-dev

  tag-release-dev:
    <<: *tag-release-base
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    depends_on:
      - deploy-dev
