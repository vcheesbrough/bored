services:
  bored:
    image: registry.desync.link/bored:${BORED_IMAGE_TAG:?BORED_IMAGE_TAG is required}
    container_name: ${BORED_CONTAINER_NAME:?BORED_CONTAINER_NAME is required}
    restart: unless-stopped
    # Run tini as PID 1 (docker injects it) so orphaned children are reaped.
    # The backend runs as PID 1 without an init and cannot reap zombies; the
    # 10s healthcheck's wget shells out to `openssl s_client` for TLS (busybox
    # here has no ssl_client applet), and each orphaned openssl leaks a
    # permanent defunct process. tini reaps them regardless of the TLS helper.
    init: true
    # A stable host name — the container name, which survives restarts *and*
    # redeploys, unlike the container id Docker would otherwise use. The
    # backend derives its `service.instance.id` telemetry attribute from it (a
    # v5 UUID of the host name), so each deploy does not start a new set of
    # metric series. Card #415.
    hostname: ${BORED_CONTAINER_NAME:?BORED_CONTAINER_NAME is required}
    # Docker's default is 10s. On SIGTERM the backend drains connections for up
    # to 4s and flushes telemetry for up to 6s more (backend/src/listen.rs,
    # observability.rs); this leaves headroom so it is never SIGKILLed while
    # flushing.
    stop_grace_period: 15s
    # A ceiling, so a runaway backend is OOM-killed and restarted rather than
    # eating the host (card #470). Lowered from 768m when Postgres replaced the
    # embedded SurrealDB (card #471): the ~530 MB peak was almost all SurrealKV's
    # in-memory index, which the backend no longer holds. Watch
    # `process.memory.usage` before tightening it further.
    #
    # `memswap_limit` equal to `mem_limit` means "no swap": without it Docker
    # allows as much swap again, and a runaway would thrash mini's shared,
    # already busy swap before the OOM killer acts.
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      bored-db:
        condition: service_healthy
    environment:
      # Container-internal key stays `BORED__OBSERVABILITY__ENVIRONMENT`; the
      # deploy-script-facing variable name stays `APP_ENV` (`.woodpecker/build.yml`
      # sets it per environment, unchanged by card #288).
      #
      # Since card #412 this is `dev` or `prod` — the environment proper, not the
      # branch dev used to pass. The same variable feeds the
      # `observability.deployment.environment` label below, so what the process
      # believes it is and what Loki labels its logs cannot disagree.
      - BORED__OBSERVABILITY__ENVIRONMENT=${APP_ENV:?APP_ENV is required}
      # The branch a dev deploy was built from, kept separate from the
      # environment above so it does not start a new Loki stream set on every
      # push. Only `/api/info` reads it, to watermark the board with the branch
      # it is serving. Empty on prod (and read as "no branch" — see
      # `blank_as_none` in backend/src/config.rs).
      - BORED__OBSERVABILITY__BRANCH=${APP_BRANCH:-}
      # Optional runtime override; when unset the backend reports the RELEASE_TAG
      # burned into the image at build time (shared::app_version). Deliberately
      # NOT part of the BORED__* layered config — see backend/src/config.rs.
      #
      # Leave it unset unless you mean it: the browser compares this value
      # against the RELEASE_TAG compiled into the wasm bundle it is running and
      # reloads when they differ (frontend/src/connection.rs). Setting it to
      # anything other than the image's own tag is a permanent mismatch — every
      # tab reloads once, then logs that it is refusing to loop.
      - APP_VERSION=${APP_VERSION:-}
      # OIDC, session, and the rest of observability now come from sovereign-config
      # (see backend/src/config.rs) via this one access URL, materialised as a file
      # rather than left in the container's process env. A blank/absent value
      # disables the sovereign layer cleanly (config.rs falls back to defaults+env).
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE=/run/secrets/SOVEREIGN_CONFIG_ACCESS_URL_FILE
      # Postgres (card #471): the service below, on the project's private
      # network. Topology, not a secret, so it lives here; the password is the
      # `database/password` leaf the app reads from sovereign-config, and port,
      # name and user take the backend's defaults (5432, bored, bored).
      - BORED__DATABASE__HOST=bored-db
    # Telemetry: the standard OTEL_* variables, from a file the deploy writes
    # and deletes around `docker compose up` (scripts/compose-up-with-otel.sh,
    # fed by `sovereign-config render /bored/devops/<env>/otel` in
    # .woodpecker/build.yml). This compose file never holds a value, and the
    # variables never pass through docker's own environment — the docker CLI
    # is OpenTelemetry-instrumented and would both export its own spans under
    # them and rewrite OTEL_RESOURCE_ATTRIBUTES. No file — the layer left off
    # the render, e2e, a local `docker compose up` — means telemetry off
    # (backend/src/observability.rs). Card #415.
    #
    # `format: raw` hands each value over byte for byte: no `$` interpolation,
    # no quote stripping, no `#` comments. A header value (a credential) could
    # contain any of those, and compose's default parsing would mangle it.
    env_file:
      - path: otel.env
        required: false
        format: raw
    secrets:
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE
    networks:
      - bored-internal
      - proxy-backend
    labels:
      # How the homelab's Alloy labels this container's logs in Loki (card #412;
      # the contract is mini-config/monitoring-stack/OBSERVABILITY.md).
      #
      # `service_name` is `bored` in both environments — the deployment is told
      # apart by `deployment_environment`, not by a different service name, so a
      # single query or dashboard covers both. Without these two labels Alloy
      # falls back to the container name, which made dev `bored-dev` and left it
      # with no environment label at all.
      #
      # Build identity is deliberately absent here: Alloy reads the image's OCI
      # `org.opencontainers.image.version`/`.revision` labels (set in
      # .woodpecker/build.yml) and attaches them as per-line structured
      # metadata, so a deploy adds lines to the existing streams instead of
      # starting a new set. Filter a build with `| image_version="<tag>"`.
      - observability.service.name=bored
      - observability.deployment.environment=${APP_ENV:?APP_ENV is required}
      - traefik.enable=true
      - traefik.http.routers.${BORED_CONTAINER_NAME}.entrypoints=websecure
      - traefik.http.routers.${BORED_CONTAINER_NAME}.rule=Host(`${BORED_HOST:?BORED_HOST is required}`)
      - traefik.http.routers.${BORED_CONTAINER_NAME}.tls=true
      - traefik.http.routers.${BORED_CONTAINER_NAME}.tls.certresolver=myresolver
      - traefik.http.services.${BORED_CONTAINER_NAME}.loadbalancer.server.port=443
      - traefik.http.services.${BORED_CONTAINER_NAME}.loadbalancer.server.scheme=https

  # Postgres (card #471). Pinned by digest, as v-note's is: a third-party
  # image with the data in it, so a rebuild must not change what runs.
  bored-db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_DB: bored
      POSTGRES_USER: bored
      # A file, not the variable itself, so the password is not in the
      # container's environment (the same convention as the backend's
      # SOVEREIGN_CONFIG_ACCESS_URL_FILE). The secret below is rendered by the
      # deploy from /bored/devops/<env>/compose, an alias of the very leaf the
      # backend reads (/bored/<env>/server/database/password), so the two can
      # never disagree. Never in git.
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
    volumes:
      - bored-pg:/var/lib/postgresql/data
    # Only on the private network: nothing outside this project can reach it.
    networks:
      - bored-internal
    healthcheck:
      # `-h 127.0.0.1`: during first-time init the image runs a temporary
      # server on the unix socket only, which a socket check would call ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bored -d bored"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  # Read-only SQL console at https://<host>/dbconsole (card #473, a port of
  # v-note #299). Off unless COMPOSE_PROFILES names `sqltool`, which the deploy
  # steps set (.woodpecker/build.yml) and nothing else does.
  #
  # No `build:`, and pinned by digest exactly as Postgres is: a third-party
  # image reached over the network, and a floating tag would let a rebuild
  # change what has database access.
  sqltool:
    profiles: [sqltool]
    image: sosedoff/pgweb@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    restart: unless-stopped
    environment:
      # 🚫 No `:-` default anywhere in this block. The obvious convenience —
      # falling back to the application's login — hands the console a
      # **superuser**, which turns pgweb's "read-only" mode into arbitrary
      # host-file read (see the migration's header,
      # backend/migrations/20261020000000_pgweb_readonly_role.sql). There is no
      # degraded mode.
      #
      # ⚠️ And no `:?` guard either, which is NOT an oversight — do not "fix" it.
      # Compose interpolates the whole file *before* it filters by profile, so a
      # `:?` here fails `docker compose config` even when this service is off,
      # breaking every deploy that does not run the console. The guard lives in
      # scripts/deploy-app.sh, conditional on the profile actually being active.
      PGWEB_DATABASE_URL: postgres://bored_pgweb:${PGWEB_DB_PASSWORD}@bored-db:5432/bored?sslmode=disable
      PGWEB_URL_PREFIX: dbconsole
      # Locks the session to the connection string above: /api/connect and
      # /api/disconnect answer "Session is locked", so there is no browser path
      # from the console to another role or database.
      PGWEB_LOCK_SESSION: "1"
      # Deliberately NOT set: PGWEB_SESSIONS re-opens the connection screen,
      # which is the one thing that would undo the lock above.
      #
      # The basic-auth backstop. Authentik is the identity gate (the routers
      # below); this keeps the console closed at the *application* layer if the
      # outpost is down or the provider misconfigured. Traefik injects the
      # matching header after Authentik approves, so nobody is prompted for it.
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS}
    command:
      - --bind=0.0.0.0
      - --listen=8081
      - --readonly
      - --skip-open
      # The hard cap on a console query. The role's own 30s statement_timeout
      # is only a default — any session may SET it higher — but pgweb cancels a
      # query at this deadline whatever the session has set.
      - --query-timeout=30
      - --log-format=json
      # Records X-Forwarded-User when present. mini-config's authentik
      # middleware forwards X-authentik-username, not that header, so this logs
      # nothing today; it is set so identity appears the day it does.
      - --log-forwarded-user
      - --metrics
      - --metrics-addr=0.0.0.0:9191
      - --metrics-path=/metrics
    depends_on:
      bored-db:
        condition: service_healthy
    networks:
      - bored-internal
      - proxy-backend
    # Liveness *and* "auth is on" in one probe: an unauthenticated request must
    # be refused. If auth were ever disabled this goes red rather than serving.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/dbconsole/api/info | grep -q 401"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      # How Alloy labels its logs and finds its metrics (mini-config
      # monitoring-stack OBSERVABILITY.md): service `bored-sql-console`, scraped
      # by the `docker-apps` job through the labels below.
      - observability.service.name=bored-sql-console
      - observability.deployment.environment=${APP_ENV}
      - observability.metrics.scrape=true
      - observability.metrics.port=9191
      - observability.metrics.path=/metrics
      - observability.metrics.scheme=http
      - traefik.enable=true

      # --- router 1: the console itself ---------------------------------
      # Rule length already outranks the app's bare `Host(…)`; set explicitly
      # anyway, because the app serving the console's URL would fail silently.
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool.entrypoints=websecure
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool.rule=Host(`${BORED_HOST}`) && PathPrefix(`/dbconsole`)
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool.priority=100
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool.tls=true
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool.tls.certresolver=myresolver
      # Middlewares are per router and run in order: LAN/VPN only, then the
      # rate limit (each console query can run for up to pgweb's 30s
      # --query-timeout against the live database), then Authentik — a
      # denied forward-auth short-circuits the chain, so the credential injector
      # last only ever runs on an approved request. `security-headers@docker`
      # is deliberately absent: its CSP has no `unsafe-eval`, and pgweb's Ace
      # editor needs it.
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool.middlewares=lan-vpn-only@docker,rate-limit@docker,authentik@docker,${BORED_CONTAINER_NAME}-sqltool-auth@docker
      - traefik.http.services.${BORED_CONTAINER_NAME}-sqltool.loadbalancer.server.port=8081

      # --- router 2: the forward-auth callback --------------------------
      # Load-bearing. Authentik builds its callback from the provider's
      # *hostname*, discarding any path, so the login completes at
      # /outpost.goauthentik.io/… — which, without this router, would match
      # the app's `Host(…)` router, get the SPA's index.html, and loop forever.
      # `authentik@docker` answers these itself; the service is only there
      # because a router needs one.
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool-callback.entrypoints=websecure
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool-callback.rule=Host(`${BORED_HOST}`) && PathPrefix(`/outpost.goauthentik.io`)
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool-callback.priority=100
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool-callback.tls=true
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool-callback.tls.certresolver=myresolver
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool-callback.middlewares=lan-vpn-only@docker,authentik@docker
      - traefik.http.routers.${BORED_CONTAINER_NAME}-sqltool-callback.service=${BORED_CONTAINER_NAME}-sqltool

      # --- the credential injector --------------------------------------
      # Satisfies pgweb's basic auth on behalf of an Authentik-approved user.
      # `customRequestHeaders` overwrites, so a client's own Authorization header
      # is replaced, never honoured. PGWEB_AUTH_B64 is derived by
      # scripts/deploy-app.sh from the two values above, so they cannot drift.
      - traefik.http.middlewares.${BORED_CONTAINER_NAME}-sqltool-auth.headers.customrequestheaders.Authorization=Basic ${PGWEB_AUTH_B64}

  # The one-off SurrealDB → Postgres import (card #471), run by
  # scripts/migrate-from-surreal.sh during a deploy and never started by
  # `up`: the profile keeps it out of every ordinary command. Same image and
  # credentials as the backend; the old SurrealKV volume mounted read-only (the
  # subcommand copies it aside before opening it). Delete with the subcommand.
  surreal-migrate:
    profiles: [surreal-migration]
    image: registry.desync.link/bored:${BORED_IMAGE_TAG:?BORED_IMAGE_TAG is required}
    entrypoint: ["./bored-backend", "migrate-from-surreal"]
    environment:
      - BORED__OBSERVABILITY__ENVIRONMENT=${APP_ENV:?APP_ENV is required}
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE=/run/secrets/SOVEREIGN_CONFIG_ACCESS_URL_FILE
      - BORED__DATABASE__HOST=bored-db
    secrets:
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE
    volumes:
      - surreal-data:/surreal:ro
    networks:
      - bored-internal

volumes:
  # Postgres's data directory, one per environment, created by the deploy.
  bored-pg:
    name: ${PG_VOLUME:?PG_VOLUME is required}
    external: true
  # The retired SurrealKV store. Only the import reads it; kept for a
  # retention period after the move, then removed with the subcommand.
  surreal-data:
    name: ${DB_VOLUME:?DB_VOLUME is required}
    external: true

networks:
  # The app ↔ database network, private to this compose project.
  bored-internal: {}
  proxy-backend:
    external: true

secrets:
  # Sourced from the Woodpecker secret `bored_{dev,prod}_sovereign_access_url`,
  # exposed as this env var at deploy time; compose materialises it as a file
  # rather than leaving the connection URL in the container's process env.
  SOVEREIGN_CONFIG_ACCESS_URL_FILE:
    environment: SOVEREIGN_CONFIG_ACCESS_URL_FILE
  # Rendered into the deploy's environment by `sovereign-config render
  # /bored/devops/<env>/compose` (card #471); compose materialises it as a file.
  POSTGRES_PASSWORD:
    environment: POSTGRES_PASSWORD
