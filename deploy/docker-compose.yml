services:
  bored:
    image: registry.desync.link/bored:${BORED_IMAGE_TAG:?BORED_IMAGE_TAG is required}
    container_name: ${BORED_CONTAINER_NAME:?BORED_CONTAINER_NAME is required}
    restart: unless-stopped
    # Run tini as PID 1 (docker injects it) so orphaned children are reaped.
    # The backend runs as PID 1 without an init and cannot reap zombies; the
    # 10s healthcheck's wget shells out to `openssl s_client` for TLS (busybox
    # here has no ssl_client applet), and each orphaned openssl leaks a
    # permanent defunct process. tini reaps them regardless of the TLS helper.
    init: true
    environment:
      # Container-internal key stays `BORED__OBSERVABILITY__ENVIRONMENT`; the
      # deploy-script-facing variable name stays `APP_ENV` (`.woodpecker/build.yml`
      # sets it per environment, unchanged by card #288).
      - BORED__OBSERVABILITY__ENVIRONMENT=${APP_ENV:?APP_ENV is required}
      # Optional runtime override; when unset the backend reports the RELEASE_TAG
      # burned into the image at build time (shared::app_version). Deliberately
      # NOT part of the BORED__* layered config — see backend/src/config.rs.
      - APP_VERSION=${APP_VERSION:-}
      # OIDC, session, and the rest of observability now come from sovereign-config
      # (see backend/src/config.rs) via this one access URL, materialised as a file
      # rather than left in the container's process env. A blank/absent value
      # disables the sovereign layer cleanly (config.rs falls back to defaults+env).
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE=/run/secrets/SOVEREIGN_CONFIG_ACCESS_URL_FILE
    secrets:
      - SOVEREIGN_CONFIG_ACCESS_URL_FILE
    volumes:
      - bored-db:/data
    networks:
      - proxy-backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.${BORED_CONTAINER_NAME}.entrypoints=websecure
      - traefik.http.routers.${BORED_CONTAINER_NAME}.rule=Host(`${BORED_HOST:?BORED_HOST is required}`)
      - traefik.http.routers.${BORED_CONTAINER_NAME}.tls=true
      - traefik.http.routers.${BORED_CONTAINER_NAME}.tls.certresolver=myresolver
      - traefik.http.services.${BORED_CONTAINER_NAME}.loadbalancer.server.port=443
      - traefik.http.services.${BORED_CONTAINER_NAME}.loadbalancer.server.scheme=https

volumes:
  bored-db:
    name: ${DB_VOLUME:?DB_VOLUME is required}
    external: true

networks:
  proxy-backend:
    external: true

secrets:
  # Sourced from the Woodpecker secret `bored_{dev,prod}_sovereign_access_url`,
  # exposed as this env var at deploy time; compose materialises it as a file
  # rather than leaving the connection URL in the container's process env.
  SOVEREIGN_CONFIG_ACCESS_URL_FILE:
    environment: SOVEREIGN_CONFIG_ACCESS_URL_FILE
